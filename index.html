<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d6b63">
<title>كوفي ريلاكس · دلّة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: phone-first cashier. Header (café name, clock, settings), one scrolling view, 5-tab bottom bar.
     Orders open as a full-screen sheet; dialogs rise from the bottom; activation lock covers everything. */
  --bg:#e9f0ee;
  --surface:#fbfdfc;
  --ink:#14201e;
  --muted:#5a6b67;
  --line:#d2dedb;
  --tea:#a84a0c;
  --tea-soft:#f8e3d1;
  --tile:#0d6b63;
  --tile-soft:#d3ebe7;
  --on-tile:#ffffff;
  --ok:#13703f;
  --danger:#b42318;
  --danger-soft:#fbe4e1;
  --st-p:#17753f; --st-h:#a84a0c; --st-a:#b42318;
  --display:"Lalezar","Readex Pro",Tahoma,system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1315; --surface:#162023; --ink:#e7efed; --muted:#93a6a1; --line:#26353a;
    --tea:#f19a4a; --tea-soft:#3a2516; --tile:#55c2b3; --tile-soft:#163b37; --on-tile:#08201d;
    --ok:#3fb879; --danger:#f07a6e; --danger-soft:#3b1d1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1315; --surface:#162023; --ink:#e7efed; --muted:#93a6a1; --line:#26353a;
  --tea:#f19a4a; --tea-soft:#3a2516; --tile:#55c2b3; --tile-soft:#163b37; --on-tile:#08201d;
  --ok:#3fb879; --danger:#f07a6e; --danger-soft:#3b1d1a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--tea);outline-offset:2px}
[hidden]{display:none !important}
small{font-size:.8em}

.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;margin:0;color:var(--tea);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-brand{font-size:12px;color:var(--muted)}
.clock{display:flex;flex-direction:column;align-items:flex-end}
.clock b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;color:var(--muted);white-space:nowrap}

main{flex:1;overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:20px}
section{display:flex;flex-direction:column;gap:10px}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;text-wrap:balance}
h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2}
h4{margin:4px 0 0;font-size:14px;color:var(--muted);font-weight:600}
.cathead{font-family:var(--body);font-size:14px;font-weight:700;color:var(--tea);margin:6px 0 0}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}
.link{background:none;border:0;color:var(--tile);font:600 14px var(--body);padding:6px 4px;text-align:right}

.note{background:var(--tea-soft);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.note.warn{background:var(--danger-soft)}
.note .link{flex:none}

.stats3,.stats2{display:grid;gap:8px}
.stats3{grid-template-columns:repeat(3,1fr)}
.stats2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat b small{font-family:var(--body);font-size:13px;color:var(--muted)}
.stat.pos b{color:var(--ok)}
.stat.neg b{color:var(--danger)}

.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tcard{min-height:92px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:4px;padding:10px 12px;text-align:right}
.tcard .tno{font-family:var(--display);font-size:32px;line-height:1;overflow-wrap:anywhere}
.tcard .tno.long{font-size:21px;line-height:1.15}
.tcard .tinfo{font-size:13px;color:var(--muted);display:flex;flex-direction:column;line-height:1.3;font-variant-numeric:tabular-nums}
.tcard.busy{background:var(--tile);border-color:var(--tile);color:var(--on-tile)}
.tcard.busy .tinfo{color:inherit}
.tcard.busy .tinfo b{font-size:15px}
.tcard .hk-late{background:#fff;color:var(--st-a);border-radius:6px;padding:0 6px;font-weight:700;margin-top:2px;width:max-content}
.tables.small{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.tables.small .tcard{min-height:60px;align-items:center;justify-content:center}
.tables.small .tno{font-size:22px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);width:100%;font:inherit;color:var(--ink);background:none;text-align:right;border-left:0;border-right:0;border-bottom:0}
.list > .lrow:first-child{border-top:0}
.lrow b{font-variant-numeric:tabular-nums;font-weight:600}
.lrow b small{color:var(--muted);font-weight:400}
.lrow .muted{font-size:13px;font-variant-numeric:tabular-nums}
.btnrow:active{background:var(--bg)}
.lrow.void span,.lrow.void b{text-decoration:line-through;opacity:.6}
.lrow.late{background:var(--danger-soft)}
.lrow .hkmin{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.lrow.late .hkmin{color:var(--danger)}
.hkbtns{display:flex;gap:4px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;margin-inline-start:6px;vertical-align:middle}
.pill.low{background:var(--tea-soft);color:var(--tea)}
.pill.out{background:var(--danger-soft);color:var(--danger)}
.pill.debt{background:var(--tea-soft);color:var(--tea)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:14px}

.txt,.num{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 16px var(--body);padding:0 12px;width:100%;min-width:0}
textarea.txt{height:auto;min-height:96px;padding:10px 12px;direction:ltr;text-align:left;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.num{font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
.btn{height:48px;border-radius:12px;border:0;padding:0 18px;font:600 15px var(--body);background:var(--tile);color:var(--on-tile);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;gap:6px}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid currentColor}
.btn.sm{height:38px;font-size:14px;padding:0 14px;border-radius:10px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.icon-btn svg{width:24px;height:24px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--tile);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}
.frow > label,.frow > span{font-size:14px}
.field{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg.wide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button{height:44px;min-width:60px;padding:0 12px;border:0;background:var(--surface);color:var(--muted);font:500 15px var(--body)}
.seg button[aria-pressed="true"]{background:var(--tile-soft);color:var(--tile);font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}
.unit{font-size:13px;color:var(--muted);white-space:nowrap}
.msg{font-size:14px;color:var(--danger)}
.msg:empty{display:none}
.erow{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center}
.rows{display:flex;flex-direction:column;gap:8px}

/* order sheet */
.sheet{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.sheet-top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.st-title{flex:1;display:flex;flex-direction:column;min-width:0}
.st-title strong{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.st-title small{color:var(--muted);font-size:12px}
.st-total{text-align:left}
.st-total b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.st-total small{font-size:12px;color:var(--muted);margin-inline-start:3px}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet-foot{display:flex;gap:10px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.sheet-foot .grow{flex:1}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--body)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat.top[aria-pressed="false"]{border-color:var(--tea);color:var(--tea);font-weight:700}
.mult{display:flex;gap:8px;align-items:center}
.mult .cat{height:36px;min-width:52px;padding:0 10px;font-weight:700;font-variant-numeric:tabular-nums}
.mult .cat[aria-pressed="true"]{background:var(--tea);border-color:var(--tea);color:#fff}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.item{position:relative;min-height:76px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:right;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s}
.item b{font-weight:600;font-size:16px;line-height:1.3}
.item span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item em{position:absolute;top:8px;left:8px;min-width:24px;height:24px;border-radius:12px;background:var(--tea);color:#fff;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 7px}
.item:active{transform:scale(.96)}
.item.flash{animation:flash .45s}
@keyframes flash{0%{background:var(--tile-soft)}100%{background:var(--surface)}}
.olist{list-style:none;margin:0;padding:0}
.olist li{display:grid;grid-template-columns:1fr auto 74px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.olist li:first-child{border-top:0}
.olist li small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.olist .amt{text-align:left;font-variant-numeric:tabular-nums;font-weight:600}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1}
.qty span{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* checkout */
.quick{display:flex;gap:8px;flex-wrap:wrap}
.qbtn{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--body);font-variant-numeric:tabular-nums}
.co-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.co-sum div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.co-sum span{font-size:12px;color:var(--muted)}
.co-sum b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.part{background:var(--tea-soft);border:0;padding:12px;gap:10px}
.part-head{display:flex;justify-content:space-between;align-items:center}
.part .list{background:var(--surface)}
.pill.cash{background:var(--danger-soft);color:var(--danger)}
.pill.own{background:var(--tile-soft);color:var(--tile)}

/* receipt */
.rc-wrap{background:var(--bg);border-radius:12px;padding:14px}
.rc{background:#fff;color:#000;width:100%;max-width:300px;margin:0 auto;padding:14px 12px;font:13px/1.55 var(--body);font-variant-numeric:tabular-nums}
.rc-h{text-align:center;font-family:var(--display);font-size:24px;line-height:1.2}
.rc-void{text-align:center;font-weight:700}
.rc-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.rc-lines{border-top:1px dashed #000;border-bottom:1px dashed #000;margin:6px 0;padding:6px 0}
.rl{display:flex;justify-content:space-between;gap:8px}
.rl.total{font-weight:700;font-size:16px;margin-top:2px}
.rl.minor{font-size:12px}
.rc-foot{text-align:center;font-size:12px;margin-top:8px}
.rimg{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin:0 auto;background:#fff}
#printArea{display:none}

/* reports */
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:26px 1fr 84px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:14px;border-radius:4px 0 0 4px;background:var(--tile)}
.bar.max i{background:var(--tea)}
.bar b{text-align:left;font-weight:600}

/* workers */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.wtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wname{font-size:17px;color:var(--ink);padding:0}
.wtop span{font-size:13px;color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg3 button{height:44px;border:0;background:var(--surface);color:var(--muted);font:500 15px var(--body)}
.seg3 button+button{border-inline-start:1px solid var(--line)}
.seg3 button[aria-pressed="true"]{color:#fff;font-weight:700}
.seg3 button[aria-pressed="true"][data-s="p"]{background:var(--st-p)}
.seg3 button[aria-pressed="true"][data-s="h"]{background:var(--st-h)}
.seg3 button[aria-pressed="true"][data-s="a"]{background:var(--st-a)}
.wbal{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.wbal b{font-variant-numeric:tabular-nums;font-size:16px}
.wbtns{display:flex;gap:8px}
.wbtns .btn{flex:1}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
details.more summary{padding:10px 0;font-size:14px;color:var(--tile);font-weight:600;cursor:pointer}
.rrow{display:grid;grid-template-columns:1fr 78px auto 40px;gap:6px;align-items:center}
.pages img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
.pages{display:flex;flex-direction:column;gap:10px}

/* tabs */
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;font:500 12px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--tile);font-weight:700}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--tile)}
.badge{position:absolute;top:4px;left:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* modal, toast, lock */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,18,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:18px 16px 22px;width:100%;max-width:560px;max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.modal{align-items:center}.modal .box{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--tea-soft);font:700 14px var(--body);padding:4px}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:28px 18px;overflow-y:auto}
.lock-box{max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:stretch}
.lock-box h2{justify-content:center;font-family:var(--display);font-weight:400;font-size:32px;color:var(--tea)}
.devcode{font:700 30px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;direction:ltr;background:var(--surface);border:1.5px dashed var(--tile);border-radius:14px;padding:14px;user-select:all;color:var(--ink)}

@media (max-width:380px){
  .stat b{font-size:20px}
  .frow{grid-template-columns:96px 1fr}
  .tables{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .brand h1{font-size:22px}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
@media print{
  @page{margin:0}
  html,body{background:#fff !important;height:auto}
  .app,.sheet,.modal,.toast,.lock{display:none !important}
  #printArea{display:block !important}
  #printArea .rc{max-width:none;width:56mm;padding:2mm;font-size:11px}
  body[data-paper="80"] #printArea .rc{width:76mm;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="28" height="32" viewBox="0 0 32 36" aria-hidden="true" style="flex:none">
        <circle cx="16" cy="3.2" r="1.8" style="fill:var(--tea)"/>
        <path d="M12.5 5.5h7l-1 3h-5z" style="fill:var(--tea)"/>
        <path d="M11.5 9.5h9c0 3.5-2 5.5-2 8.5 0 4.2 5.5 6.2 5.5 12.5H8c0-6.3 5.5-8.3 5.5-12.5 0-3-2-5-2-8.5z" style="fill:var(--tea)"/>
        <path d="M12 14C7.5 13.5 4.5 10 2.5 6.5" style="fill:none;stroke:var(--tea);stroke-width:2.2;stroke-linecap:round"/>
        <path d="M20.5 12.5c4.5 0 5.5 6.5 2.5 10.5" style="fill:none;stroke:var(--tile);stroke-width:2;stroke-linecap:round"/>
        <path d="M6 33.5h20" style="stroke:var(--tile);stroke-width:2;stroke-linecap:round"/>
      </svg>
